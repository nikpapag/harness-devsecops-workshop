apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 {{- if lower .Values.sename}}
 name: ingress-router-web-{{ lower .Values.sename }}
 {{- else }}
 name: ingress-router
 {{- end }}
 annotations:
   kubernetes.io/ingress.class: nginx
spec:
  rules:
  {{- if lower .Values.sename}}
  - host: {{ lower .Values.sename }}.{{lower .Values.workshop_domain}}.harnessevents.com
  {{- else }}
  - host: {{lower .Values.workshop_domain}}.harnessevents.com
  {{- end }}
    http:
     paths:
     - pathType: ImplementationSpecific
       backend:
       {{- if lower .Values.sename}}
          service:
             name: web-frontend-{{lower .Values.sename }}-svc
             port:
               number: 8080
       {{- else }}
          service:
             name: web-frontend-svc
             port:
               number: 8080
       {{- end }}
